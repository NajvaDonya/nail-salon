# Local MySQL for integration/e2e tests (same engine as production Prisma schema).
# Neon is PostgreSQL-only — you cannot host MySQL there. Use this stack instead.
#
#   docker compose -f docker-compose.test.yml up -d
#   copy .env.test.example → .env.test (URLs below match defaults)
#   npm run db:test:prepare
#   npm run test:integration

services:
  mysql-test:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - '3307:3306'
    environment:
      MYSQL_ROOT_PASSWORD: test_root_password
      MYSQL_DATABASE: nail_salon_test
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-ptest_root_password']
      interval: 5s
      timeout: 5s
      retries: 20
